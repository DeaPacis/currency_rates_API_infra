apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: external-ip-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.184.0.240/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
