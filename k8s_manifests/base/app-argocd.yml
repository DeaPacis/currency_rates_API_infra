apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: currency-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@education-git.yadro.com:education/devops/2026/a.pochebut/infra.git
    targetRevision: main
    path: k8s_manifests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true