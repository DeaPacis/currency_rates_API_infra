---
- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  register: _kubelet_swapoff_result
  failed_when: false
  changed_when: _kubelet_swapoff_result.rc == 0
  tags: [swap]

- name: Remove swap from fstab
  ansible.posix.mount:
    name: swap
    fstype: swap
    state: absent
  tags: [swap]

- name: Add Kubernetes APT key
  ansible.builtin.apt_key:
    url: "{{ _kubelet_apt_repo_key }}"
    state: present
  tags: [repo]

- name: Add Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb {{ _kubelet_apt_repo }} /"
    state: present
    update_cache: true
  tags: [repo]

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ _kubelet_packages }}"
    state: present
    update_cache: true
  tags: [packages]

- name: Hold Kubernetes packages to prevent automatic updates
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ _kubelet_packages }}"
  tags: [packages]

- name: Create kubelet systemd drop-in directory
  ansible.builtin.file:
    path: "{{ _kubelet_systemd_dir }}"
    state: directory
    mode: "0755"
  tags: [config]

- name: Configure kubelet extra args
  ansible.builtin.template:
    src: 10-kubeadm.conf.j2
    dest: "{{ _kubelet_systemd_dir }}/10-kubeadm.conf"
    mode: "0644"
  notify: Restart kubelet
  tags: [config]

- name: Ensure kubelet service is enabled and started
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true
    daemon_reload: true
  tags: [service]

- name: Verify kubelet installation
  ansible.builtin.command: kubelet --version
  register: kubelet_version_check
  changed_when: false
  tags: [verify]

- name: Display kubelet version
  ansible.builtin.debug:
    msg: "Kubelet installed: {{ kubelet_version_check.stdout }}"
  tags: [verify]
