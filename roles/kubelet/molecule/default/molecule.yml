---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: kubelet-instance
    image: geerlingguy/docker-ubuntu2204-ansible
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
  inventory:
    host_vars:
      kubelet-instance:
        _kubelet_apt_repo_key: "https://mirror.yandex.ru/mirrors/pkgs.k8s.io/core/stable/v1.32/deb/Release.key"
        _kubelet_apt_repo: "https://mirror.yandex.ru/mirrors/pkgs.k8s.io/core/stable/v1.32/deb/"
        _kubelet_packages:
          - kubelet
          - kubectl
        _kubelet_systemd_dir: "/etc/systemd/system/kubelet.service.d"

verifier:
  name: testinfra