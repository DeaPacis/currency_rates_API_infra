---
- name: Load kernel modules for CRI-O
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  when: ansible_virtualization_type != "docker"
  tags: [kernel]

- name: Configure sysctl for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }
  when: ansible_virtualization_type != "docker"
  tags: [sysctl]

- name: Install required dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present
    update_cache: true
  tags: [packages]

- name: Add CRI-O repository key
  ansible.builtin.apt_key:
    url: "{{ _crio_crio_repo_key }}"
    state: present
  tags: [repo]

- name: Add CRI-O repository for specific version
  ansible.builtin.apt_repository:
    repo: "deb {{ _crio_crio_repo }} /"
    state: present
    update_cache: true
  tags: [repo]

- name: Install CRI-O packages
  ansible.builtin.apt:
    name: "{{ _crio_packages }}"
    state: present
    update_cache: true
  notify: Restart crio
  tags: [packages]

- name: Configure CRI-O cgroup driver
  ansible.builtin.copy:
    content: cgroup_manager = "{{ crio_cgroup_driver }}"
    dest: /etc/crio/crio.conf.d/20-cgroup-driver.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart crio
  tags: [config]

- name: Ensure CRI-O service is enabled and started
  ansible.builtin.systemd:
    name: crio
    state: started
    enabled: true
    daemon_reload: true
  tags: [service]

- name: Verify CRI-O installation
  ansible.builtin.command: crio --version
  register: crio_version_check
  changed_when: false
  tags: [verify]

- name: Display CRI-O version
  ansible.builtin.debug:
    msg: "CRI-O installed: {{ crio_version_check.stdout }}"
  tags: [verify]
