---
- name: Install kubeadm package
  ansible.builtin.apt:
    name: "{{ _kubeadm_packages }}"
    state: present
    update_cache: true
  tags: [packages]

- name: Hold kubeadm package to prevent automatic updates
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold
  tags: [packages]

- name: Verify kubeadm installation
  ansible.builtin.command: kubeadm version
  register: kubeadm_version_check
  changed_when: false
  tags: [verify]

- name: Display kubeadm version
  ansible.builtin.debug:
    msg: "Kubeadm installed: {{ kubeadm_version_check.stdout }}"
  tags: [verify]
