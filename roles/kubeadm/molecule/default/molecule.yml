---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: kubeadm-instance
    image: geerlingguy/docker-ubuntu2204-ansible
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
  inventory:
    host_vars:
      kubeadm-instance:
        _kubeadm_packages:
          - kubeadm

verifier:
  name: testinfra